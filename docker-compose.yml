version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: trinetra_postgis
    environment:
      POSTGRES_USER: trinetra
      POSTGRES_PASSWORD: trinetra_secure_password
      POSTGRES_DB: trinetra_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinetra -d trinetra_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: trinetra_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tileserver:
    image: maptiler/tileserver-gl:v4.11.0
    container_name: trinetra_tileserver
    ports:
      - "8081:8080"
    volumes:
      - ./data/raw/basemap:/data
    command: ["--mbtiles", "/data/delhi_ncr.mbtiles", "--verbose"]
    restart: unless-stopped

volumes:
  postgis_data:
  qdrant_data:
